[package]
name = "scrollback-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "scrollback-app"
path = "src/main.rs"

[dependencies]
scrollback-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
pulldown-cmark = { version = "0.13", default-features = false }
futures = "0.3"
tray-icon = { version = "0.26", default-features = false }

# On Linux the tray icon speaks the StatusNotifierItem protocol directly, so
# the app needs neither GTK nor libappindicator.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
