[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nucleo-matcher = "0.3"

# GPUI 0.2.2 pulls in an xattr that no longer compiles on Linux; this copy
# has the one-line fix. See vendor/xattr/README.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
